<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입체감 예시: 금고 자물쇠</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 20px; background: #FBF8F3; color: #1F1F1F; font-family: "Pretendard", sans-serif; word-break: keep-all; }
  h1 { font-size: 22px; margin: 0 0 8px; text-align: center; }
  .note { text-align: center; color: #6B6B6B; margin: 0 0 32px; }
  .wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px; max-width: 820px; margin: 0 auto; }
  .cap { font-size: 14px; font-weight: 700; color: #6B6B6B; margin: 0 0 12px; text-align: center; }
  .lbl { font-weight: 700; margin: 8px 0 12px; font-size: 16px; }
  .ic { font-size: 40px; line-height: 1; }
  .in { display: block; margin: 0 auto 12px; width: 100%; max-width: 220px; height: 48px; border: 2px solid #E9E4DC; border-radius: 12px; background: #fff; text-align: center; font: inherit; font-size: 18px; font-weight: 700; letter-spacing: .1em; }
  .go { border: none; background: #C8281C; color: #fff; border-radius: 999px; padding: 12px 28px; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }

  /* 지금: 평평한 카드 */
  .flat { background: #fff; border: 2px solid #1F1F1F; border-radius: 16px; padding: 24px; text-align: center; }

  /* 입체감: 금고 */
  .safe { position: relative; perspective: 900px; border-radius: 20px; padding: 14px; background: linear-gradient(160deg, #5a5f66, #2b2f34); box-shadow: 0 16px 30px rgba(40,25,10,.28), inset 0 1px 0 rgba(255,255,255,.25); }
  .inside { position: absolute; inset: 14px; border-radius: 12px; background: radial-gradient(circle at 50% 30%, #FFF6DA, #F6E2B0); box-shadow: inset 0 6px 16px rgba(0,0,0,.35); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .inside b { font-size: 20px; color: #0E7A45; }
  .inside span { font-size: 14px; color: #6B5A44; }
  .door { position: relative; transform-origin: left center; transition: transform .9s cubic-bezier(.3,1.3,.5,1); border-radius: 12px; }
  .door.open { transform: rotateY(-105deg); }
  .face { border-radius: 12px; padding: 24px; text-align: center; background: linear-gradient(180deg, #f4f5f7, #d7dbe0); box-shadow: inset 0 2px 0 #fff, inset 0 -3px 0 #b5bbc2, 0 2px 0 #9aa1a9; }
  .face .in { border-color: #b5bbc2; box-shadow: inset 0 3px 6px rgba(0,0,0,.18); }
  .hinge { position: absolute; left: -7px; width: 9px; height: 28px; border-radius: 3px; background: linear-gradient(90deg, #8a9097, #c9ced3, #8a9097); }
  .go3d { border: none; background: #C8281C; color: #fff; border-radius: 999px; padding: 12px 28px; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 5px 0 #8E1A12; transition: transform .08s, box-shadow .08s; }
  .go3d:active { transform: translateY(5px); box-shadow: 0 0 0 #8E1A12; }
  .ctrl { text-align: center; margin-top: 16px; }
  .ctrl button { border: 1px solid #E9E4DC; background: #fff; border-radius: 999px; padding: 10px 20px; font: inherit; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .door { transition: none; } }
</style>
</head>
<body>
  <h1>입체감 예시: 자물쇠 박스</h1>
  <p class="note">게임에는 아직 적용하지 않은 미리보기예요. 오른쪽 금고의 '열기'를 눌러 보세요.</p>
  <div class="wrap">
    <div>
      <p class="cap">지금 (평평한 카드)</p>
      <div class="flat">
        <div class="ic">🔒</div>
        <p class="lbl">금고 비밀번호 (영문 7자)</p>
        <input class="in" value="ONLYONE" readonly aria-label="비밀번호 예시">
        <button class="go">열기</button>
      </div>
    </div>
    <div>
      <p class="cap">입체감 (금고 + 눌리는 버튼 + 문 열림)</p>
      <div class="safe">
        <div class="inside"><div class="ic">🔓</div><b>문이 열렸어요!</b><span>안쪽에 다음 방 열쇠가 있어요</span></div>
        <div class="door" id="door">
          <span class="hinge" style="top:18%"></span><span class="hinge" style="bottom:18%"></span>
          <div class="face">
            <div class="ic">🔒</div>
            <p class="lbl">금고 비밀번호 (영문 7자)</p>
            <input class="in" value="ONLYONE" readonly aria-label="비밀번호 예시">
            <button class="go3d" id="open">열기</button>
          </div>
        </div>
      </div>
      <div class="ctrl"><button id="reset">다시 닫기</button></div>
    </div>
  </div>
  <script>
    const door = document.getElementById("door");
    document.getElementById("open").onclick = () => door.classList.add("open");
    document.getElementById("reset").onclick = () => door.classList.remove("open");
  </script>
</body>
</html>
