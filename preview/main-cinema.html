<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디자인 시안 D: 끌어서 30년 건너기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root { --red: #C8281C; --ink: #111; --spring: cubic-bezier(.2,.9,.3,1.15); --p: 0; --x: .06; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d0c0b; color: #fff; font-family: "CJ Body", "Pretendard", sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; overflow: hidden; }
  .nw { white-space: nowrap; }

  .stage { position: fixed; inset: 0; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }

  /* ── 두 장의 사진: 1996(아래) 위에 2026이 손잡이만큼 드러남 ── */
  .layer { position: absolute; inset: 0; }
  .layer img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .then img { filter: sepia(.55) saturate(.7) contrast(1.08) brightness(.82) blur(1.2px); transform: scale(calc(1.06 + var(--p) * .04)); }
  .now { opacity: var(--p); }
  .done .now { opacity: 1; transition: opacity .6s ease; }
  .now img { filter: saturate(1.05) brightness(1.15); transform: scale(calc(1.1 - var(--p) * .06)); object-position: 55% 50%; }
  /* 필름 입자 + 가장자리 어둡게 (1996 쪽만 강하게) */
  .grain { position: absolute; inset: -50%; pointer-events: none; opacity: calc(.32 - var(--p) * .26); mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain .5s steps(4) infinite; }
  @keyframes grain { 0% { transform: translate(0,0); } 25% { transform: translate(-3%,2%); } 50% { transform: translate(2%,-3%); } 75% { transform: translate(-2%,-1%); } }
  .shade { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(0,0,0,.55) 100%), linear-gradient(180deg, rgba(0,0,0,.45) 0%, transparent 30%, transparent 55%, rgba(0,0,0,.75) 100%); }

  /* ── 시간 막대: 왼쪽 1996(과거) → 오른쪽 2026(미래) ── */
  .track { position: absolute; left: 50%; bottom: 9vh; transform: translateX(-50%); width: min(82vw, 820px); height: 64px; transition: opacity .4s; }
  .rail { position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: rgba(255,255,255,.28); }
  .fill { position: absolute; left: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; width: calc(var(--p) * 100%); background: #fff; box-shadow: 0 0 16px rgba(255,255,255,.6); }
  .tick { position: absolute; top: 50%; width: 2px; height: 12px; margin: -6px 0 0 -1px; background: rgba(255,255,255,.5); border-radius: 1px; }
  .tick span { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 600; color: rgba(255,255,255,.75); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tick.end span { color: #fff; font-weight: 700; }
  .handle { position: absolute; top: 50%; left: 0; transform: translate(-50%, -50%); width: 64px; height: 64px; border-radius: 50%; border: none; cursor: grab;
    background: rgba(255,255,255,.2); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.8), 0 12px 30px rgba(0,0,0,.35);
    color: #fff; font-size: 24px; display: grid; place-items: center; touch-action: none; }
  .handle:active { cursor: grabbing; transform: translate(-50%, -50%) scale(.94); }
  .handle:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .handle::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.6); animation: ping 1.8s ease-out infinite; }
  .dragged .handle::after { display: none; }
  @keyframes ping { from { transform: scale(.85); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
  .handle-label { position: absolute; bottom: calc(100% + 6px); left: 0; transform: translateX(-12%); white-space: nowrap; font-size: 14px; font-weight: 600;
    background: rgba(0,0,0,.4); backdrop-filter: blur(10px); padding: 6px 12px; border-radius: 999px; transition: opacity .3s; }
  .handle-label i { margin-left: 4px; }
  .dragged .handle-label, .done .handle-label { opacity: 0; }

  /* ── 큰 연도 ── */
  .year { position: absolute; top: 9vh; left: 50%; transform: translateX(-50%); margin: 0; font-family: "CJ Title", "Pretendard", sans-serif; font-weight: 800;
    font-size: clamp(88px, 17vw, 240px); line-height: .9; letter-spacing: -.05em; font-variant-numeric: tabular-nums; color: rgba(255,255,255,.95);
    text-shadow: 0 10px 40px rgba(0,0,0,.35); transition: opacity .6s, transform .6s var(--spring); }
  .year small { display: block; text-align: center; margin-top: 10px; font-size: clamp(13px, 1.3vw, 16px); font-weight: 600; letter-spacing: .02em; color: rgba(255,255,255,.75); }

  /* ── 이야기 문장: 끌어가는 위치에 따라 바뀜 ── */
  .beats { position: absolute; left: 50%; bottom: calc(9vh + 92px); transform: translateX(-50%); width: min(90vw, 640px); height: 4.2em; text-align: center; font-size: clamp(18px, 2vw, 24px); line-height: 1.45; font-weight: 600; }
  .beat { position: absolute; inset: 0; opacity: 0; transform: translateY(10px); transition: opacity .5s, transform .5s var(--spring); text-wrap: balance; }
  .beat.on { opacity: 1; transform: none; }
  .beat span { display: block; }

  /* ── 도착 화면 ── */
  .arrive { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 6vw 9vh; pointer-events: none; }
  .arrive > * { opacity: 0; transform: translateY(18px); transition: opacity .7s, transform .8s var(--spring); }
  .done .arrive > * { opacity: 1; transform: none; pointer-events: auto; }
  .done .arrive > :nth-child(2) { transition-delay: .12s; } .done .arrive > :nth-child(3) { transition-delay: .26s; } .done .arrive > :nth-child(4) { transition-delay: .4s; }
  .kicker { margin: 0 0 14px; font-size: 14px; font-weight: 600; color: rgba(255,255,255,.8); }
  .title { margin: 0; font-family: "CJ Title", "Pretendard", sans-serif; font-weight: 800; font-size: clamp(44px, 7vw, 104px); line-height: .98; letter-spacing: -.045em; }
  .title em { font-style: normal; color: #FF5A4B; }
  .punch { margin: 18px 0 28px; font-size: clamp(18px, 2vw, 24px); font-weight: 600; }
  .punch b { color: #fff; background: var(--red); padding: 2px 8px; border-radius: 6px; font-weight: 700; }
  .done .year { opacity: 0; transform: translate(-50%, -20px); }
  .done .track, .done .beats { opacity: 0; pointer-events: none; transition: opacity .4s; }
  .done .shade { background: linear-gradient(90deg, rgba(0,0,0,.7) 0%, rgba(0,0,0,.25) 55%, transparent 100%), linear-gradient(180deg, transparent 40%, rgba(0,0,0,.6) 100%); }

  .entry { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .entry label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.75); }
  .entry input { width: 190px; height: 52px; border-radius: 14px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); backdrop-filter: blur(14px);
    color: #fff; padding: 0 16px; font: inherit; font-size: 16px; }
  .entry input::placeholder { color: rgba(255,255,255,.55); }
  .entry input:focus { outline: none; border-color: #fff; background: rgba(255,255,255,.2); }
  .go { height: 52px; padding: 0 26px; border: none; border-radius: 14px; background: var(--red); color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 12px 30px -10px rgba(200,40,28,.8); transition: transform .25s var(--spring); }
  .go:hover { transform: translateY(-2px); } .go:active { transform: scale(.97); }
  .go i { transition: transform .25s var(--spring); } .go:hover i { transform: translateX(3px); }

  /* ── 상단 ── */
  .top { position: absolute; top: 20px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: rgba(255,255,255,.85); }
  .brand i { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: #fff; color: #111; font-size: 13px; font-weight: 800; font-style: normal; }
  .tools { display: flex; gap: 8px; }
  .chip { border: none; cursor: pointer; font: inherit; font-size: 13px; color: #fff; background: rgba(255,255,255,.14); backdrop-filter: blur(10px); padding: 8px 12px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: center; }
  .chip:hover { background: rgba(255,255,255,.24); }
  .tag { font-size: 12px; color: rgba(255,255,255,.6); }
  .side { position: absolute; top: 50%; transform: translateY(-50%); font-size: 13px; font-weight: 700; letter-spacing: .1em; color: rgba(255,255,255,.7); writing-mode: vertical-rl; transition: opacity .4s; }
  .side.l { left: 18px; } .side.r { right: 18px; }
  .done .side { opacity: 0; }

  .chip, .tag { white-space: nowrap; }
  @media (max-width: 640px) { .tag, .brand span { display: none; } .entry input { width: 100%; } .entry label { flex: 1 1 100%; } .go { width: 100%; justify-content: center; } .side { display: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="layer then"><img src="../assets/history/1996_hetbahn.jpg" alt="1996년 햇반 출시 당시 매장"></div>
  <div class="layer now"><img src="../assets/photo/hetbahn_2026_banner.png" alt="2026년 오늘, 햇반 생산 라인"></div>
  <div class="grain"></div>
  <div class="shade"></div>


  <p class="year" id="year" aria-live="polite">1996<small id="year-sub">햇반이 처음 나온 해</small></p>

  <div class="beats" aria-live="polite">
    <!-- 연도와 문장이 맞도록: 1996 묻음 → 2010 비비고 → 2026 오늘 -->
    <p class="beat on" data-max="0.12"><span>1996년, 햇반이 처음 나온 날</span><span>「ONLYONE 레시피북」을 타임캡슐에 묻었어요.</span></p>
    <p class="beat" data-max="0.97"><span>캡슐이 땅속에 잠든 동안</span><span>비비고 같은 새 맛이 나왔어요.</span></p>
    <p class="beat" data-max="1.01"><span>그리고 2026년 오늘,</span><span>30년 만에 캡슐을 엽니다.</span></p>
  </div>

  <div class="track" id="track">
    <div class="rail"></div><div class="fill"></div>
    <i class="tick end" style="left:0"><span>1996</span></i>
    <i class="tick" style="left:33.33%"><span>2006</span></i>
    <i class="tick" style="left:66.66%"><span>2016</span></i>
    <i class="tick end" style="left:100%"><span>2026</span></i>
    <span class="handle-label" id="hlabel">오른쪽으로 끌어서 30년 건너오기<i class="ti ti-arrow-right"></i></span>
    <button class="handle" id="handle" role="slider" aria-label="1996년에서 2026년으로 넘기기" aria-valuemin="1996" aria-valuemax="2026" aria-valuenow="1996"><i class="ti ti-chevrons-right"></i></button>
  </div>

  <section class="arrive" aria-label="게임 입장">
    <p class="kicker">햇반 30주년 · 2026</p>
    <h1 class="title"><em>ONLYONE</em><br>레시피를 찾아라</h1>
    <p class="punch">캡슐을 열었는데, <b>레시피북이 없어요.</b></p>
    <div class="entry">
      <label>조 이름<input placeholder="햇반 조"></label>
      <label>내 이름<input placeholder="홍길동"></label>
      <button class="go">1953년부터 추적하기 <i class="ti ti-arrow-right"></i></button>
    </div>
  </section>

  <div class="top">
    <div class="brand"><i>CJ</i>제일제당 온보딩</div>
    <div class="tools">
      <span class="tag">디자인 시안 D</span>
      <button class="chip" id="auto"><i class="ti ti-player-play"></i>자동으로 보기</button>
      <button class="chip" id="replay"><i class="ti ti-rotate"></i>처음부터</button>
    </div>
  </div>
</div>

<script>
const stage = document.getElementById("stage"), handle = document.getElementById("handle"), hlabel = document.getElementById("hlabel");
const yearEl = document.getElementById("year"), yearSub = document.getElementById("year-sub");
const beats = [...document.querySelectorAll(".beat")];
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
let p = 0, target = 0, dragging = false, done = false, autoRaf = 0;

function render() {
  stage.style.setProperty("--p", p.toFixed(4));
  handle.style.left = hlabel.style.left = (p * 100) + "%";
  const y = Math.round(1996 + 30 * p);
  yearEl.firstChild.nodeValue = y;
  yearSub.textContent = y === 1996 ? "햇반이 처음 나온 해" : y === 2010 ? "비비고가 나온 해" : y === 2026 ? "햇반 30주년, 오늘" : `캡슐을 묻은 지 ${y - 1996}년`;
  handle.setAttribute("aria-valuenow", y);
  const idx = beats.findIndex((b) => p < +b.dataset.max);
  beats.forEach((b, i) => b.classList.toggle("on", i === idx));
  /* 2026에 도착하면 마지막 문장을 읽을 시간을 준 뒤 입장 화면으로 */
  if (p >= 0.995 && !done && !arriveTimer) arriveTimer = setTimeout(arrive, REDUCED ? 0 : 2600);
  if (p < 0.99 && arriveTimer) { clearTimeout(arriveTimer); arriveTimer = 0; }
}
let arriveTimer = 0;
function arrive() {
  done = true; p = 1; stage.style.setProperty("--p", 1);
  stage.classList.add("done");
}
const track = document.getElementById("track");
function setFromX(clientX) { const r = track.getBoundingClientRect(); target = Math.max(0, Math.min(1, (clientX - r.left) / r.width)); }

/* 끌기 */
handle.addEventListener("pointerdown", (e) => {
  if (done) return;
  dragging = true; cancelAnimationFrame(autoRaf); stage.classList.add("dragged");
  try { handle.setPointerCapture(e.pointerId); } catch (_) {}
});
handle.addEventListener("pointermove", (e) => { if (dragging) setFromX(e.clientX); });
handle.addEventListener("pointerup", () => {
  dragging = false;
  if (target > 0.8) target = 1;        /* 거의 다 왔으면 끝까지 */
});
/* 화면 아무 데나 눌러도 그 위치로 */
track.addEventListener("pointerdown", (e) => {
  if (done || e.target.closest("button")) return;
  stage.classList.add("dragged"); setFromX(e.clientX);
});
/* 키보드 */
handle.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") { stage.classList.add("dragged"); target = Math.min(1, target + 1 / 30); }
  if (e.key === "ArrowLeft") target = Math.max(0, target - 1 / 30);
  if (e.key === "End" || e.key === "Enter") target = 1;
});

/* 부드럽게 따라가기 */
(function loop() {
  if (!done) {
    p += (target - p) * (REDUCED ? 1 : 0.14);
    if (Math.abs(target - p) < 0.0005) p = target;
    render();
  }
  requestAnimationFrame(loop);
})();

/* 자동으로 보기: 문장마다 멈춰서 읽을 시간을 줌
 * 각 문장 구간의 가운데로 1.4초 동안 이동 → 3.2초 머무름 */
let autoRun = 0;
const STOPS = [0, 0.4667, 1];   /* 1996 → 2010 → 2026 (도착 화면은 2026에서 2.6초 뒤) */
const MOVE = 1800, HOLD = 3800;
const easeIO = (t) => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const wait = (ms) => new Promise((r) => setTimeout(r, REDUCED ? 0 : ms));
function moveTo(to, run) {
  return new Promise((res) => {
    const from = target, t0 = performance.now(), dur = REDUCED ? 1 : MOVE;
    (function step(now) {
      if (run !== autoRun) return res();
      const k = Math.min(1, (now - t0) / dur);
      target = from + (to - from) * easeIO(k);
      if (k < 1) autoRaf = requestAnimationFrame(step); else res();
    })(t0);
  });
}
document.getElementById("auto").onclick = async () => {
  if (done) reset();
  stage.classList.add("dragged");
  const run = ++autoRun;
  for (const stop of STOPS) {
    await moveTo(stop, run);
    if (run !== autoRun) return;
    if (stop < 1) await wait(HOLD);
    if (run !== autoRun) return;
  }
};
/* 직접 끌면 자동 보기는 멈춤 */
handle.addEventListener("pointerdown", () => autoRun++);
track.addEventListener("pointerdown", () => autoRun++);
function reset() { autoRun++; clearTimeout(arriveTimer); arriveTimer = 0; done = false; p = target = 0; stage.classList.remove("done", "dragged"); render(); }
document.getElementById("replay").onclick = reset;
addEventListener("resize", render);
render();
</script>
</body>
</html>
